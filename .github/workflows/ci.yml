name: u-SHA-jua Enterprise CI/CD Quality Gate Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-verify:
    name: FastAPI Backend Pytest, Migrations & Security Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Deterministic Schema Migrations & B-Tree Indexes
        run: |
          python -c "from database import engine, init_db; from migrations.runner import get_migration_status; init_db(); st = get_migration_status(engine); assert st['head_version'] == '003', st; print('Verified Head Migration:', st['head_version'])"

      - name: Run Full Automated Pytest Suite (90 Tests)
        run: pytest -v

  frontend-verify:
    name: React TypeScript Strict Check & Vite Code-Split Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript Compiler Verification (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build Production Code-Split Bundle
        run: npm run build

  deployment-config-audit:
    name: Docker Multi-Stage, Nginx Proxy & Env Security Audit
    runs-on: ubuntu-latest
    needs: [backend-verify, frontend-verify]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit Container & Proxy Hardening Directives
        run: |
          grep -q "FROM python:3.11-slim AS builder" server/Dockerfile
          grep -q "USER ushajua" server/Dockerfile
          grep -q "HEALTHCHECK" server/Dockerfile
          grep -q "FROM node:20-alpine AS builder" client/Dockerfile
          grep -q "proxy_pass http://server:8000/ws;" client/nginx.conf
          grep -q "X-Frame-Options" client/nginx.conf
          echo "All Docker, Nginx, and Security Hardening gates verified."
