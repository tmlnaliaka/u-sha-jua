version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ushajua_postgis
    environment:
      POSTGRES_DB: ushajua_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securepassword
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ushajua_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ushajua_server
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:securepassword@db:5432/ushajua_db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      AUTH_ACCESS_TOKEN_MINUTES: ${AUTH_ACCESS_TOKEN_MINUTES:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Emergency Operations Administrator}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ushajua_client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    depends_on:
      - server

volumes:
  postgis_data:
